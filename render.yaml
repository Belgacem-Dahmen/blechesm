services:
  - type: web
    name: blechesm-api
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blechesm-db
          property: connectionString
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: JWT_CLIENT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://blechesm.vercel.app
      # À renseigner manuellement dans Render Dashboard → Environment :
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: blechesm-db
    databaseName: blechesm
    plan: free
    region: frankfurt
    ipAllowList: []
